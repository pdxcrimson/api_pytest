[project]
name = "api-pytest"
version = "0.1.0"
description = "A Python framework with REST APIs and Pytest"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.26.0",
    "pytest>=9.0.3",
    "python-utils>=3.9.1",
    "requests>=2.33.1",
    "urllib3>=2.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

